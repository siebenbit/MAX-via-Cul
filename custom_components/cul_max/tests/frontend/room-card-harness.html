<!doctype html>
<html lang="de">
<meta charset="utf-8"><title>MAX! Raumkonfiguration · simuliertes Home Assistant</title>
<style>
:root{--primary-text-color:#191c1e;--secondary-text-color:#62696d;--primary-color:#519eb5;--secondary-background-color:#f2f5f6;--divider-color:#d9dfe2;--error-color:#ba3127;--card-background-color:#fff}
body{margin:20px;font:16px system-ui;background:var(--secondary-background-color);color:var(--primary-text-color)}cul-max-room-config-card{display:block;max-width:960px;margin:auto}
body.dark{--primary-text-color:#e5e9eb;--secondary-text-color:#b1b8bd;--primary-color:#70b5cd;--secondary-background-color:#141b20;--divider-color:#3b464f;--error-color:#ffb4ab;--card-background-color:#202a32}
</style>
<script src="../../frontend/cul-max-room-config-card.js"></script>
<cul-max-room-config-card></cul-max-room-config-card>
<script>
function makeRoom(id,name){
 const week=Object.fromEntries(['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].map(day=>[day,'17,06:00,21,09:00,18,17:00,21,22:00,17']));
 const values={comfort_temperature:21,eco_temperature:17,window_open_temperature:12,window_open_duration:15,week_profile:week};
 return {id,name,values,revision:{temperature:'t1',week_profile:'w1'},mixed:[],locks:{temperature:false,week_profile:false},has_draft:false,
  devices:[{name:'Heizkörper links',address:'123456',config_entry_id:'cul',paired:true,confirmed:structuredClone(values),values:structuredClone(values),draft_blocks:[],jobs:[]},
   {name:'Wandthermostat',address:'234567',config_entry_id:'cul',paired:true,confirmed:structuredClone(values),values:structuredClone(values),draft_blocks:[],jobs:[]}]};
}
var rooms=[makeRoom('living','Wohnzimmer'),makeRoom('bed','Schlafzimmer')],calls=[],listeners=new Map(),push,failNext=false;
var card=document.querySelector('cul-max-room-config-card');
var hass={user:{is_admin:true},connection:{subscribeMessage:async callback=>{push=callback;queueMicrotask(()=>callback({rooms:structuredClone(rooms)}));return()=>{};},addEventListener:(name,cb)=>listeners.set(name,cb),removeEventListener:name=>listeners.delete(name)},
 callWS:async call=>{calls.push(call);if(failNext){failNext=false;throw Error('Konfiguration wurde zwischenzeitlich geändert. Bitte neu laden.');}
  const room=rooms.find(r=>r.id===call.service_data.area_id)||rooms[0];
  if(call.service==='save_room_config'){
   const changes=call.service_data.changes;
   const blocks=[];
   if(Object.keys(changes).some(k=>k!=='week_profile'))blocks.push('temperature');
   if(changes.week_profile)blocks.push('week_profile');
   for(const block of blocks){room.locks[block]=true;room.revision[block]+='x';}
   for(const device of room.devices){
    for(const [key,value]of Object.entries(changes)){if(key==='week_profile'){Object.assign(device.values.week_profile,value);Object.assign(room.values.week_profile,value);}else{device.values[key]=value;room.values[key]=value;}}
    for(const block of blocks)device.jobs.push({id:device.address+'-'+block,block,operation_id:call.service_data.operation_id,status:'waiting_for_credits',confirmed_steps:[],completed_steps:[],steps:[{id:'one'},{id:'two'}]});
   }
   queueMicrotask(()=>push({rooms:structuredClone(rooms)}));return{response:{status:'accepted',job_ids:['one']}};
  }
  if(call.service==='cancel_config_job'){for(const r of rooms)for(const d of r.devices)for(const j of d.jobs)if(j.id===call.service_data.job_id){j.status='cancelled';r.locks[j.block]=false;}queueMicrotask(()=>push({rooms:structuredClone(rooms)}));return{response:{status:'cancelled'}};}
  return{response:{rooms:structuredClone(rooms)}};
 }};
card.setConfig({type:'custom:cul-max-room-config-card'});card.hass=hass;
window.pushFixture=()=>push({rooms:structuredClone(rooms)});
window.resetFixture=()=>{rooms=[makeRoom('living','Wohnzimmer'),makeRoom('bed','Schlafzimmer')];card._changes={};card._baseRevision={};card._area='living';card._message='';card._error='';pushFixture();};
window.finishFixture=()=>{for(const room of rooms){room.locks={temperature:false,week_profile:false};for(const d of room.devices){d.confirmed=structuredClone(d.values);for(const j of d.jobs){j.status='completed';j.confirmed_steps=['one','two'];}}}pushFixture();};
</script>
</html>
